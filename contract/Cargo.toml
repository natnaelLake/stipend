[package]
name = "warden-vault"
description = "Policy-enforced spending vault for AI agents on NEAR"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

# Unit tests deliberately depend on nothing that touches the network, so
# `cargo test` here is fast and works offline. Sandbox tests live in
# ../integration, which is where near-workspaces (and its sandbox download) is.
[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
